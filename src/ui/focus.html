<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wipe Ad — Focus</title>
<link rel="icon" href="../icons/icon-32.png">
<link rel="stylesheet" href="common.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--grad); color: #fff; }
  .box { max-width: 520px; text-align: center; }
  h1 { font-size: 30px; margin: 10px 0; }
  p { opacity: .9; font-size: 16px; }
  .clock { font-size: 54px; font-weight: 800; letter-spacing: 1px; margin: 16px 0; }
  button { background: rgba(255,255,255,.18); color: #fff; }
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:56px">🎯</div>
    <h1 data-i18n="focusTitle"></h1>
    <p data-i18n="focusBody"></p>
    <div class="clock" id="clock"></div>
    <p class="small" id="until"></p>
    <button id="settings" data-i18n="focusSettings"></button>
  </div>
  <script type="module" src="focus.js"></script>
</body>
</html>
