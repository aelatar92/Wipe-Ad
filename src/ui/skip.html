<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wipe Ad</title>
<link rel="icon" href="../icons/icon-32.png">
<link rel="stylesheet" href="common.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .box { max-width: 560px; text-align: center; }
  code { display: block; word-break: break-all; direction: ltr; background: var(--card); padding: 10px; border-radius: 10px; margin: 12px 0; }
</style>
</head>
<body>
  <div class="box" id="box" hidden>
    <img src="../icons/icon-48.png" width="40" height="40" alt="">
    <p data-i18n="skipFailed"></p>
    <code id="orig"></code>
    <button id="go" class="primary" data-i18n="continue"></button>
  </div>
  <script type="module" src="skip.js"></script>
</body>
</html>
