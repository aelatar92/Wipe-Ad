<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wipe Ad — Blocked</title>
<link rel="icon" href="../icons/icon-32.png">
<link rel="stylesheet" href="common.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 30% 10%, #7f1d1d, #111827 60%); color: #fff; padding: 16px; }
  .box { max-width: 560px; width: 100%; background: rgba(17,24,39,.85); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .ic { font-size: 54px; }
  h1 { margin: 6px 0 8px; font-size: 24px; }
  p { color: #d1d5db; }
  code { display: block; background: #030712; padding: 10px 12px; border-radius: 10px; word-break: break-all; direction: ltr; text-align: left; color: #fca5a5; margin: 6px 0 18px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .actions button { padding: 12px; }
  .ghost { background: transparent; color: #9ca3af; text-decoration: underline; font-weight: 500; }
  .brand { display: flex; align-items: center; gap: 8px; margin-top: 22px; color: #9ca3af; font-size: 12px; }
</style>
</head>
<body>
  <div class="box">
    <div class="ic">🛡️</div>
    <h1 data-i18n="dangerTitle"></h1>
    <p data-i18n="dangerBody"></p>
    <div class="small muted" data-i18n="blockedUrl"></div>
    <code id="url"></code>
    <div class="actions">
      <button id="back" class="primary" data-i18n="goBack"></button>
      <button id="proceed" class="ghost" data-i18n="proceed"></button>
      <button id="always" class="ghost" data-i18n="alwaysAllow"></button>
    </div>
    <div class="brand"><img src="../icons/icon-16.png" alt=""> Wipe Ad</div>
  </div>
  <script type="module" src="blocked.js"></script>
</body>
</html>
